          (pkg / 'safe_cli.py').write_text(r'''from __future__ import annotations

import argparse
from pathlib import Path
import sys
from typing import Sequence

from . import _legacy_cli
from .publication import PublicationError, PublicationItem, publish_release_set, temporary_sibling


def _value(args: list[str], flag: str) -> str | None:
    prefix = f"{flag}="
    for index, value in enumerate(args):
        if value.startswith(prefix):
            return value[len(prefix):]
        if value == flag:
            if index + 1 >= len(args):
                raise ValueError(f"{flag} 缺少值")
            return args[index + 1]
    return None


def _remove_value(args: list[str], flag: str) -> None:
    prefix = f"{flag}="
    index = 0
    while index < len(args):
        if args[index].startswith(prefix):
            del args[index]
            continue
        if args[index] == flag:
            del args[index:index + 2]
            continue
        index += 1


def _set_value(args: list[str], flag: str, value: str) -> None:
    _remove_value(args, flag)
    args.extend((flag, value))


def _render_option_strings() -> set[str]:
    parser = _legacy_cli.build_parser()
    subparsers = next(
        action for action in parser._actions
        if isinstance(action, argparse._SubParsersAction)
    )
    render_parser = subparsers.choices["render"]
    return {
        option
        for action in render_parser._actions
        for option in action.option_strings
    }


def _volume_flag() -> str:
    options = _render_option_strings()
    for candidate in ("--volume-json", "--volume-audit-json"):
        if candidate in options:
            return candidate
    raise ValueError("内部 CLI 未公开体量审计报告参数")


def _release_render(args: list[str]) -> int:
    output_value = _value(args, "--output")
    if not output_value:
        raise ValueError("release render 必须指定 --output")
    output = Path(output_value)
    docx_report = Path(
        _value(args, "--docx-audit-json")
        or output.with_name(f"{output.stem}.docx-audit.json")
    )
    volume_flag = _volume_flag()
    alternate = "--volume-audit-json" if volume_flag == "--volume-json" else "--volume-json"
    volume_report = Path(
        _value(args, volume_flag)
        or _value(args, alternate)
        or output.with_name(f"{output.stem}.volume.json")
    )
    forwarded = list(args)
    _remove_value(forwarded, alternate)
    staged_output = temporary_sibling(output, ".docx.stage")
    staged_docx_report = temporary_sibling(docx_report, ".json.stage")
    staged_volume_report = temporary_sibling(volume_report, ".json.stage")
    _set_value(forwarded, "--output", str(staged_output))
    _set_value(forwarded, "--docx-audit-json", str(staged_docx_report))
    _set_value(forwarded, volume_flag, str(staged_volume_report))
    try:
        result = _legacy_cli.main(forwarded)
        if result != 0:
            return result
        publish_release_set(
            (
                PublicationItem(staged_docx_report, docx_report),
                PublicationItem(staged_volume_report, volume_report),
                PublicationItem(staged_output, output),
            ),
            commit_last=output,
        )
        print(output)
        return 0
    finally:
        staged_output.unlink(missing_ok=True)
        staged_docx_report.unlink(missing_ok=True)
        staged_volume_report.unlink(missing_ok=True)


def main(argv: Sequence[str] | None = None) -> int:
    args = list(sys.argv[1:] if argv is None else argv)
    try:
        profile = _value(args, "--profile") or "review"
        if args and args[0] == "render" and profile == "release":
            return _release_render(args)
        return _legacy_cli.main(args)
    except (ValueError, PublicationError, StopIteration) as exc:
        print(f"ERROR: {exc}", file=sys.stderr)
        return 2


if __name__ == "__main__":
    raise SystemExit(main())
''', encoding='utf-8')

          (tests / 'test_codex_audited_baseline_derivation.py').write_text(r'''from pathlib import Path
from types import SimpleNamespace

from gjb438c_suite.suite_baseline_guard import (
    audited_document_codes,
    baseline_issues,
)


def _files(tmp_path: Path, code: str):
    paths = {}
    for key, suffix in (("source", ".md"), ("docx", ".docx"), ("volume", ".json")):
        path = tmp_path / f"{code}{suffix}"
        path.write_text(key, encoding="utf-8")
        paths[key] = path.name
    return paths


def test_only_successfully_audited_documents_can_satisfy_baselines(tmp_path: Path):
    manifest = {
        "suite": {"required_documents": ["SPS", "SVD"]},
        "documents": {"SPS": _files(tmp_path, "SPS"), "SVD": _files(tmp_path, "SVD")},
    }
    report = SimpleNamespace(issues=[{"severity": "ERROR", "document_type": "SPS"}])
    audited = audited_document_codes(manifest, report, tmp_path / "suite.yaml")
    assert audited == {"SVD"}
    assert any("SPS" in message for _, _, message in baseline_issues(manifest, audited))


def test_global_suite_error_fails_closed(tmp_path: Path):
    manifest = {
        "suite": {"required_documents": ["SPS", "SVD"]},
        "documents": {"SPS": _files(tmp_path, "SPS"), "SVD": _files(tmp_path, "SVD")},
    }
    report = SimpleNamespace(issues=[{"severity": "ERROR", "code": "PORTFOLIO_TOO_SMALL"}])
    assert audited_document_codes(manifest, report, tmp_path / "suite.yaml") == set()


def test_manifest_keys_without_existing_audit_artifacts_never_count(tmp_path: Path):
    manifest = {
        "suite": {"required_documents": ["SPS", "SVD"]},
        "documents": {"SPS": {"source": "missing.md", "docx": "missing.docx", "volume": "missing.json"}, "SVD": _files(tmp_path, "SVD")},
    }
    report = SimpleNamespace(issues=[])
    assert audited_document_codes(manifest, report, tmp_path / "suite.yaml") == {"SVD"}
''', encoding='utf-8')

          public_test = tests / 'test_public_cli_guard.py'
          public_test.write_text(r'''from pathlib import Path

from gjb438c_suite import cli


def _arg(args, flag):
    return Path(args[args.index(flag) + 1])


def _fake_parser():
    import argparse
    parser = argparse.ArgumentParser()
    sub = parser.add_subparsers(dest="command")
    render = sub.add_parser("render")
    render.add_argument("input")
    render.add_argument("--profile")
    render.add_argument("--output")
    render.add_argument("--docx-audit-json")
    render.add_argument("--volume-json")
    return parser


def test_public_cli_release_with_equals_syntax_stages_default_reports(monkeypatch, tmp_path):
    def fake_legacy(args):
        output = _arg(args, "--output")
        audit = _arg(args, "--docx-audit-json")
        volume = _arg(args, "--volume-json")
        output.write_text("docx", encoding="utf-8")
        audit.write_text("audit", encoding="utf-8")
        volume.write_text("volume", encoding="utf-8")
        return 0
    monkeypatch.setattr("gjb438c_suite.safe_cli._legacy_cli.build_parser", _fake_parser)
    monkeypatch.setattr("gjb438c_suite.safe_cli._legacy_cli.main", fake_legacy)
    output = tmp_path / "release.docx"
    result = cli.main(["render", "source.md", "--profile=release", f"--output={output}"])
    assert result == 0
    assert output.read_text(encoding="utf-8") == "docx"
    assert (tmp_path / "release.docx-audit.json").read_text(encoding="utf-8") == "audit"
    assert (tmp_path / "release.volume.json").read_text(encoding="utf-8") == "volume"


def test_public_cli_is_guarded_entrypoint():
    assert cli.main.__module__ == "gjb438c_suite.safe_cli"
