name: gjb438c-md-first

on:
  pull_request:
    paths:
      - 'skills/gjb438c-md-first/**'
      - '.github/workflows/gjb438c-md-first.yml'
      - '.claude-plugin/**'
      - 'README.md'
      - 'VERIFICATION.md'
  push:
    branches: [main, feat/gjb438c-md-first-suite]
    paths:
      - 'skills/gjb438c-md-first/**'
      - '.github/workflows/gjb438c-md-first.yml'
      - '.claude-plugin/**'
      - 'README.md'
      - 'VERIFICATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/gjb438c-md-first/pyproject.toml
      - name: Install LibreOffice and UNO bridge for TOC checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno poppler-utils
          PYTHONPATH=/usr/lib/python3/dist-packages python -c 'import uno'
      - name: Install suite
        run: python -m pip install -e 'skills/gjb438c-md-first[test]'
      - name: Unit tests
        run: python -m pytest skills/gjb438c-md-first/tests
      - name: All 20 template outlines
        run: python skills/gjb438c-md-first/tools/smoke_all_templates.py
      - name: Content gates
        run: |
          gjb438c audit skills/gjb438c-md-first/examples/SRS.example.md --profile release
          gjb438c audit skills/gjb438c-md-first/examples/SDD.example.md \
            --profile release \
            --baseline-srs skills/gjb438c-md-first/examples/SRS.example.md
      - name: Render and audit release DOCX
        run: |
          mkdir -p dist
          gjb438c render skills/gjb438c-md-first/examples/SRS.example.md \
            --output dist/SRS.docx --profile release --refresh-toc
          gjb438c render skills/gjb438c-md-first/examples/SDD.example.md \
            --output dist/SDD.docx --profile release \
            --baseline-srs skills/gjb438c-md-first/examples/SRS.example.md \
            --refresh-toc
          gjb438c audit-docx dist/SRS.docx --profile release
          gjb438c audit-docx dist/SDD.docx --profile release
      - name: Markdown round trip
        run: |
          gjb438c import-word dist/SRS.docx --output dist/SRS.returned.md
          cmp skills/gjb438c-md-first/examples/SRS.example.md dist/SRS.returned.md
      - uses: actions/upload-artifact@v4
        with:
          name: gjb438c-md-first-smoke-docx
          path: dist/*.docx
