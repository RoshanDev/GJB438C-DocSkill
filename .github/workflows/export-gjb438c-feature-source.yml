name: export-gjb438c-feature-source

on:
  push:
    branches:
      - feat/20-document-profiles-and-volume-gates
    paths:
      - .github/workflows/export-gjb438c-feature-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        run: |
          tar -czf /tmp/gjb438c-feature-source.tar.gz \
            README.md MD-FIRST-SUITE.md VERIFICATION.md THIRD_PARTY_NOTICES.md \
            .claude-plugin .github/workflows/gjb438c-md-first.yml \
            skills/gjb438c-md-first skills/gjb438c-* \
            --exclude='skills/word-fillter-*'
      - uses: actions/upload-artifact@v4
        with:
          name: gjb438c-feature-source
          path: /tmp/gjb438c-feature-source.tar.gz
          if-no-files-found: error
          retention-days: 1
