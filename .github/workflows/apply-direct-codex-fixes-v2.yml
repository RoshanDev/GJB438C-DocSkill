from dataclasses import dataclass
import os
from pathlib import Path
import shutil
import tempfile
from typing import Iterable


class PublicationError(RuntimeError):
    pass


@dataclass(frozen=True, slots=True)
class PublicationItem:
    staged: Path
    final: Path


def _fsync_file(path: Path) -> None:
    with path.open("rb") as stream:
        os.fsync(stream.fileno())


def _fsync_dir(path: Path) -> None:
    if os.name == "nt":
        return
    descriptor = os.open(path, os.O_RDONLY)
    try:
        os.fsync(descriptor)
    finally:
        os.close(descriptor)


def temporary_sibling(final: str | Path, suffix: str = ".stage") -> Path:
    target = Path(final)
    target.parent.mkdir(parents=True, exist_ok=True)
    descriptor, name = tempfile.mkstemp(
        prefix=f".{target.name}.", suffix=suffix, dir=target.parent
    )
    os.close(descriptor)
    path = Path(name)
    path.unlink(missing_ok=True)
    return path


def publish_release_set(
    items: Iterable[PublicationItem], *, commit_last: str | Path
) -> None:
    values = list(items)
    if not values:
        raise PublicationError("发布集为空")
    final_paths = [item.final.resolve() for item in values]
    if len(final_paths) != len(set(final_paths)):
        raise PublicationError("发布集包含重复目标路径")
    for item in values:
        if not item.staged.is_file():
            raise PublicationError(f"暂存文件不存在：{item.staged}")
        item.final.parent.mkdir(parents=True, exist_ok=True)
        _fsync_file(item.staged)

    last = Path(commit_last).resolve()
    if last not in final_paths:
        raise PublicationError("commit_last 必须属于发布集")
    ordered = sorted(values, key=lambda item: item.final.resolve() == last)
    backups: dict[Path, Path] = {}
    published: list[Path] = []
    try:
        # Every byte is staged before the first public path changes. Existing
        # files are copied to sibling backups so a process-level failure can
        # restore the complete previous release set.
        for item in ordered:
            final = item.final.resolve()
            if final.exists():
                backup = temporary_sibling(final, ".backup")
                shutil.copy2(final, backup)
                _fsync_file(backup)
                backups[final] = backup
        for item in ordered:
            final = item.final.resolve()
            os.replace(item.staged, final)
            _fsync_file(final)
            _fsync_dir(final.parent)
            published.append(final)
    except BaseException as exc:
        for final in reversed(published):
            backup = backups.get(final)
            try:
                if backup and backup.exists():
                    os.replace(backup, final)
                else:
                    final.unlink(missing_ok=True)
                _fsync_dir(final.parent)
            except OSError:
                pass
        raise PublicationError(f"发布集提交失败，已尝试回滚：{exc}") from exc
    finally:
        for backup in backups.values():
            backup.unlink(missing_ok=True)
        for item in values:
            item.staged.unlink(missing_ok=True)
''', encoding='utf-8')

          (pkg / 'suite_baseline_guard.py').write_text(r'''from __future__ import annotations

from pathlib import Path
from typing import Any, Iterable
import yaml

PROFILE_ROOT = Path(__file__).resolve().parent / "data" / "profiles"


def required_document_codes(manifest: dict[str, Any]) -> set[str]:
    suite = manifest.get("suite") if isinstance(manifest, dict) else None
    values = suite.get("required_documents", []) if isinstance(suite, dict) else []
    return {str(value).upper() for value in values}


def manifest_document_codes(manifest: dict[str, Any]) -> set[str]:
    values = manifest.get("documents") if isinstance(manifest, dict) else None
    return {str(value).upper() for value in values} if isinstance(values, dict) else set()


def profile_baselines(code: str) -> tuple[tuple[str, ...], tuple[str, ...]]:
    path = PROFILE_ROOT / f"{code.lower()}.yaml"
    raw = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
    baselines = raw.get("baselines") or {}
    required = tuple(str(v).upper() for v in baselines.get("required", []) or [])
    required_any = tuple(str(v).upper() for v in baselines.get("required_any", []) or [])
    return required, required_any


def baseline_issues(
    manifest: dict[str, Any], audited_codes: Iterable[str]
) -> list[tuple[str, str, str]]:
    required_docs = required_document_codes(manifest)
    configured = manifest_document_codes(manifest)
    audited = {str(value).upper() for value in audited_codes}
    issues: list[tuple[str, str, str]] = []
    for code in sorted(required_docs):
        required, required_any = profile_baselines(code)
        for baseline in required:
            if baseline not in audited:
                reason = "未列入 required_documents" if baseline not in required_docs else "未成功审计"
                if baseline in configured and baseline not in required_docs:
                    reason += "；孤立的 documents 条目不得充当基线"
                issues.append((code, "SUITE_REQUIRED_BASELINE_NOT_AUDITED", f"{code} 必选基线 {baseline} {reason}"))
        if required_any and not (set(required_any) & audited):
            choices = ", ".join(required_any)
            issues.append((code, "SUITE_REQUIRED_ANY_BASELINE_NOT_AUDITED", f"{code} 至少需要一个成功审计的基线：{choices}"))
    return issues


def failed_document_codes(report: object) -> set[str]:
    failed: set[str] = set()
    for issue in getattr(report, "issues", ()):
        if isinstance(issue, dict):
            severity = str(issue.get("severity", "")).upper()
            code = issue.get("document_type") or issue.get("document")
        else:
            severity = str(getattr(issue, "severity", "")).upper()
            code = getattr(issue, "document_type", None) or getattr(issue, "document", None)
        if severity == "ERROR" and code:
            failed.add(str(code).upper())
    return failed
''', encoding='utf-8')

