name: export-review-source
on:
  push:
    branches: [feat/20-document-profiles-v03]
    paths: [.github/workflows/export-review-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p /tmp/review-source
          git archive --format=tar.gz HEAD -o /tmp/review-source/source.tar.gz
          git rev-parse HEAD > /tmp/review-source/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: current-profile-source
          path: /tmp/review-source/
          retention-days: 1
