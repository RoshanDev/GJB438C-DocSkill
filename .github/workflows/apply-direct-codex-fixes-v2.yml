from pathlib import Path
import os
import pytest

from gjb438c_suite.publication import (
    PublicationError,
    PublicationItem,
    publish_release_set,
)
from gjb438c_suite.suite_baseline_guard import baseline_issues


def test_stale_unselected_manifest_entry_cannot_satisfy_svd_baseline():
    manifest = {
        "suite": {"required_documents": ["SVD"]},
        "documents": {"SVD": {}, "SPS": {"source": "stale.md"}},
    }
    issues = baseline_issues(manifest, audited_codes={"SVD"})
    assert any(code == "SUITE_REQUIRED_BASELINE_NOT_AUDITED" and doc == "SVD" for doc, code, _ in issues)
    assert any("SPS" in message and "孤立" in message for _, _, message in issues)


def test_failed_required_baseline_does_not_count_as_audited():
    manifest = {
        "suite": {"required_documents": ["SPS", "SVD"]},
        "documents": {"SPS": {}, "SVD": {}},
    }
    issues = baseline_issues(manifest, audited_codes={"SVD"})
    assert any("SPS" in message and "未成功审计" in message for _, _, message in issues)


def test_publication_requires_all_staged_files_before_touching_finals(tmp_path: Path):
    final_docx = tmp_path / "release.docx"
    final_docx.write_text("old-docx", encoding="utf-8")
    staged_docx = tmp_path / "new.docx"
    staged_docx.write_text("new-docx", encoding="utf-8")
    missing_report = tmp_path / "missing.json"
    with pytest.raises(PublicationError):
        publish_release_set(
            (
                PublicationItem(missing_report, tmp_path / "audit.json"),
                PublicationItem(staged_docx, final_docx),
            ),
            commit_last=final_docx,
        )
    assert final_docx.read_text(encoding="utf-8") == "old-docx"


def test_publication_rolls_back_reports_when_docx_commit_fails(tmp_path: Path, monkeypatch):
    finals = [tmp_path / "audit.json", tmp_path / "volume.json", tmp_path / "release.docx"]
    staged = [tmp_path / "audit.new", tmp_path / "volume.new", tmp_path / "release.new"]
    for index, path in enumerate(finals):
        path.write_text(f"old-{index}", encoding="utf-8")
    for index, path in enumerate(staged):
        path.write_text(f"new-{index}", encoding="utf-8")
    real_replace = os.replace
    def fail_docx(source, target):
        if Path(target).name == "release.docx":
            raise OSError("simulated docx publication failure")
        return real_replace(source, target)
    monkeypatch.setattr(os, "replace", fail_docx)
    with pytest.raises(PublicationError):
        publish_release_set(
            tuple(PublicationItem(s, f) for s, f in zip(staged, finals)),
            commit_last=finals[-1],
        )
    assert [path.read_text(encoding="utf-8") for path in finals] == ["old-0", "old-1", "old-2"]


def test_publication_commits_docx_last(tmp_path: Path, monkeypatch):
    finals = [tmp_path / "audit.json", tmp_path / "volume.json", tmp_path / "release.docx"]
    staged = [tmp_path / "audit.new", tmp_path / "volume.new", tmp_path / "release.new"]
    for index, path in enumerate(staged):
        path.write_text(f"new-{index}", encoding="utf-8")
    order = []
    real_replace = os.replace
    def record(source, target):
        order.append(Path(target).name)
        return real_replace(source, target)
    monkeypatch.setattr(os, "replace", record)
    publish_release_set(
        tuple(PublicationItem(s, f) for s, f in zip(staged, finals)),
        commit_last=finals[-1],
    )
    assert order[-1] == "release.docx"
    assert [path.read_text(encoding="utf-8") for path in finals] == ["new-0", "new-1", "new-2"]
''', encoding='utf-8')
