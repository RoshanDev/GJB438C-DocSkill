name: analyze-gjb438c-template-pages

on:
  push:
    branches:
      - feat/20-document-profiles-and-volume-gates
    paths:
      - .github/workflows/analyze-template-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python -m pip install --disable-pip-version-check pypdf
      - name: Render all 20 templates and count physical pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gjb-template-pdfs analysis
          python - <<'PY'
          from pathlib import Path
          import csv
          import os
          import subprocess
          import tempfile
          from pypdf import PdfReader

          root = Path('GJB438C全套模版/438C-2021全套模板')
          docs = sorted(root.glob('*.docx'))
          if len(docs) != 20:
              raise SystemExit(f'expected 20 templates, found {len(docs)}')
          rows = []
          for index, docx in enumerate(docs, 1):
              with tempfile.TemporaryDirectory(prefix='lo-profile-') as profile:
                  env = os.environ.copy()
                  env['HOME'] = profile
                  result = subprocess.run(
                      [
                          'libreoffice',
                          f'-env:UserInstallation={Path(profile).resolve().as_uri()}',
                          '--headless', '--convert-to', 'pdf',
                          '--outdir', '/tmp/gjb-template-pdfs', str(docx),
                      ],
                      env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      text=True, timeout=180,
                  )
              pdf = Path('/tmp/gjb-template-pdfs') / f'{docx.stem}.pdf'
              if result.returncode != 0 or not pdf.is_file():
                  raise SystemExit(f'conversion failed: {docx}\n{result.stdout}\n{result.stderr}')
              pages = len(PdfReader(str(pdf)).pages)
              rows.append({
                  'index': index,
                  'filename': docx.name,
                  'docx_bytes': docx.stat().st_size,
                  'rendered_pages': pages,
              })
              print(f'{pages:4d}  {docx.name}')

          with Path('analysis/template-page-counts.csv').open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)

          pages = [row['rendered_pages'] for row in rows]
          lines = [
              '# GJB 438C 仓库模板渲染页数基线', '',
              '> 这些是空白/示例模板的 LibreOffice 物理页数，不是项目成品页数，也不是标准法定下限。', '',
              '| 序号 | 模板 | 物理页数 |', '|---:|---|---:|',
          ]
          lines.extend(f"| {row['index']} | {row['filename']} | {row['rendered_pages']} |" for row in rows)
          lines.extend([
              '',
              f"范围：{min(pages)}–{max(pages)} 页；合计：{sum(pages)} 页；平均：{sum(pages)/len(pages):.1f} 页。",
          ])
          Path('analysis/template-page-counts.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gjb438c-template-page-counts
          path: analysis/template-page-counts.*
          retention-days: 1
