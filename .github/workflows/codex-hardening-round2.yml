name: codex-hardening-round2

on:
  push:
    branches: [fix/codex-review-findings-20260905]
    paths: [.github/workflows/codex-hardening-round2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-review-findings-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden direct runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          pkg = root / 'skills/gjb438c-md-first/gjb438c_suite'
          safe = pkg / 'safe_cli.py'
          if not safe.is_file() or not (pkg / '_legacy_cli.py').is_file():
              raise SystemExit('guarded direct CLI was not materialized')

          safe.write_text(r'''from __future__ import annotations

import inspect
from pathlib import Path
import sys
from typing import Sequence

from . import _legacy_cli
from .publication import PublicationError, PublicationItem, publish_release_set, temporary_sibling


def _value(args: list[str], flag: str) -> str | None:
    try:
        index = args.index(flag)
    except ValueError:
        return None
    if index + 1 >= len(args):
        raise ValueError(f"{flag} 缺少值")
    return args[index + 1]


def _set_value(args: list[str], flag: str, value: str) -> None:
    try:
        index = args.index(flag)
    except ValueError:
        args.extend((flag, value))
    else:
        if index + 1 >= len(args):
            raise ValueError(f"{flag} 缺少值")
        args[index + 1] = value


def _volume_flag() -> str:
    source = inspect.getsource(_legacy_cli)
    for candidate in ("--volume-json", "--volume-audit-json"):
        if candidate in source:
            return candidate
    raise ValueError("内部 CLI 未公开体量审计报告参数")


def _release_render(args: list[str]) -> int:
    output_value = _value(args, "--output")
    if not output_value:
        raise ValueError("release render 必须指定 --output")
    output = Path(output_value)
    docx_report = Path(
        _value(args, "--docx-audit-json")
        or output.with_name(f"{output.stem}.docx-audit.json")
    )
    volume_flag = _volume_flag()
    supplied_volume = _value(args, volume_flag)
    # Accept the alternate spelling from callers, then normalize to the parser's
    # actual option so older command examples cannot silently skip the report.
    alternate = "--volume-audit-json" if volume_flag == "--volume-json" else "--volume-json"
    supplied_alternate = _value(args, alternate)
    volume_report = Path(
        supplied_volume
        or supplied_alternate
        or output.with_name(f"{output.stem}.volume.json")
    )
    forwarded = list(args)
    if supplied_alternate:
        index = forwarded.index(alternate)
        del forwarded[index:index + 2]
    staged_output = temporary_sibling(output, ".docx.stage")
    staged_docx_report = temporary_sibling(docx_report, ".json.stage")
    staged_volume_report = temporary_sibling(volume_report, ".json.stage")
    _set_value(forwarded, "--output", str(staged_output))
    _set_value(forwarded, "--docx-audit-json", str(staged_docx_report))
    _set_value(forwarded, volume_flag, str(staged_volume_report))
    try:
        result = _legacy_cli.main(forwarded)
        if result != 0:
            return result
        publish_release_set(
            (
                PublicationItem(staged_docx_report, docx_report),
                PublicationItem(staged_volume_report, volume_report),
                PublicationItem(staged_output, output),
            ),
            commit_last=output,
        )
        print(output)
        return 0
    finally:
        staged_output.unlink(missing_ok=True)
        staged_docx_report.unlink(missing_ok=True)
        staged_volume_report.unlink(missing_ok=True)


def main(argv: Sequence[str] | None = None) -> int:
    args = list(sys.argv[1:] if argv is None else argv)
    try:
        if args and args[0] == "render" and (_value(args, "--profile") or "review") == "release":
            return _release_render(args)
        return _legacy_cli.main(args)
    except (ValueError, PublicationError) as exc:
        print(f"ERROR: {exc}", file=sys.stderr)
        return 2


if __name__ == "__main__":
    raise SystemExit(main())
''', encoding='utf-8')

          suite = pkg / 'suite.py'
          text = suite.read_text(encoding='utf-8')
          text = text.replace(
              '# CODEX_AUDITED_BASELINE_GUARD_V1\nfrom .suite_baseline_guard import',
              '# CODEX_AUDITED_BASELINE_GUARD_V1\nfrom pathlib import Path as _guard_Path\nimport yaml as _guard_yaml\nfrom .suite_baseline_guard import',
          )
          text = text.replace(
              'manifest = yaml.safe_load(Path(manifest_path).read_text(encoding="utf-8")) or {}',
              'manifest = _guard_yaml.safe_load(_guard_Path(manifest_path).read_text(encoding="utf-8")) or {}',
          )
          suite.write_text(text, encoding='utf-8')

          # Replace the first public-CLI test with one that proves default report
          # paths are still staged and published as a set.
          test = root / 'skills/gjb438c-md-first/tests/test_public_cli_guard.py'
          test.write_text(r'''from pathlib import Path

from gjb438c_suite import cli


def _arg(args, flag):
    return Path(args[args.index(flag) + 1])


def test_public_cli_release_generates_default_reports_as_one_set(monkeypatch, tmp_path):
    def fake_legacy(args):
        output = _arg(args, "--output")
        docx_report = _arg(args, "--docx-audit-json")
        volume_flag = "--volume-json" if "--volume-json" in args else "--volume-audit-json"
        volume_report = _arg(args, volume_flag)
        output.write_text("docx", encoding="utf-8")
        docx_report.write_text("audit", encoding="utf-8")
        volume_report.write_text("volume", encoding="utf-8")
        return 0
    monkeypatch.setattr("gjb438c_suite.safe_cli._legacy_cli.main", fake_legacy)
    monkeypatch.setattr(
        "gjb438c_suite.safe_cli.inspect.getsource",
        lambda _module: '"--volume-json"',
    )
    output = tmp_path / "release.docx"
    result = cli.main([
        "render", "source.md", "--profile", "release",
        "--output", str(output),
    ])
    assert result == 0
    assert output.read_text(encoding="utf-8") == "docx"
    assert (tmp_path / "release.docx-audit.json").read_text(encoding="utf-8") == "audit"
    assert (tmp_path / "release.volume.json").read_text(encoding="utf-8") == "volume"


def test_public_cli_is_the_guarded_entrypoint():
    assert cli.main.__module__ == "gjb438c_suite.safe_cli"
''', encoding='utf-8')

          (root / 'skills/gjb438c-md-first/tests/test_no_transient_integration_scaffolding.py').write_text(r'''from pathlib import Path


