name: gjb438c-md-first
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "skills/gjb438c-md-first[test]" wheel
      - run: python -m compileall -q skills/gjb438c-md-first/gjb438c_suite
      - run: python -m pytest skills/gjb438c-md-first/tests -q
      - run: python tools/check_wheel.py
  office:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Office integration dependencies (no source mutations)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno fonts-noto-cjk poppler-utils
      - run: python -m pip install -e 'skills/gjb438c-md-first[test]'
      - run: python -m pytest skills/gjb438c-md-first/tests/test_office_integration.py -q
        env:
          GJB_OFFICE_TESTS: '1'
          PYTHONPATH: /usr/lib/python3/dist-packages
      - name: Synthetic 300-page pagination and duplicate detector (not content acceptance)
        run: python tools/stress_volume_gate.py
