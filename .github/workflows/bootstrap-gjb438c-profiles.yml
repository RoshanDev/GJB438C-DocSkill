name: bootstrap-gjb438c-document-profiles

on:
  push:
    branches:
      - feat/20-document-profiles-and-volume-gates
    paths:
      - .bootstrap-profiles/**
      - .github/workflows/bootstrap-gjb438c-profiles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/20-document-profiles-and-volume-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct profile generator
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-profiles/part-* > /tmp/profile-bootstrap.tar.xz
          echo "c5375dcd636782d63bca1f08332faac3c2a9a521ca07daa7150b714a2fc8120f  /tmp/profile-bootstrap.tar.xz" | sha256sum -c -
          tar -xJf /tmp/profile-bootstrap.tar.xz -C .
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check -e 'skills/gjb438c-md-first[test]'
      - name: Generate packaged profiles and thin skills
        run: |
          python skills/gjb438c-md-first/tools/generate_profiles.py
          python skills/gjb438c-md-first/tools/generate_profiles.py --check
      - name: Basic profile validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('skills/gjb438c-md-first/gjb438c_suite/data/profiles')
          files = sorted(root.glob('*.yaml'))
          assert len(files) == 20, len(files)
          for path in files:
              value = yaml.safe_load(path.read_text(encoding='utf-8'))
              assert value['outline'], path
              assert value['artifact_contracts'], path
              assert value['volume_policy']['large']['minimum_pages'] > 0, path
          thin = sorted(Path('skills').glob('gjb438c-*/SKILL.md'))
          thin = [path for path in thin if path.parent.name != 'gjb438c-md-first']
          assert len(thin) == 20, len(thin)
          print(f'profiles={len(files)} thin_skills={len(thin)}')
          PY
      - name: Commit generated files
        run: |
          rm -rf .bootstrap-profiles
          rm -f .github/workflows/bootstrap-gjb438c-profiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate 20 self-contained document profiles"
          git push origin HEAD:feat/20-document-profiles-and-volume-gates
