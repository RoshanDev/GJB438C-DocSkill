          (pkg / 'suite_baseline_guard.py').write_text(r'''from __future__ import annotations

from pathlib import Path
from typing import Any, Iterable
import yaml

PROFILE_ROOT = Path(__file__).resolve().parent / "data" / "profiles"


def required_document_codes(manifest: dict[str, Any]) -> set[str]:
    suite = manifest.get("suite") if isinstance(manifest, dict) else None
    values = suite.get("required_documents", []) if isinstance(suite, dict) else []
    return {str(value).upper() for value in values}


def manifest_document_codes(manifest: dict[str, Any]) -> set[str]:
    values = manifest.get("documents") if isinstance(manifest, dict) else None
    return {str(value).upper() for value in values} if isinstance(values, dict) else set()


def profile_baselines(code: str) -> tuple[tuple[str, ...], tuple[str, ...]]:
    path = PROFILE_ROOT / f"{code.lower()}.yaml"
    raw = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
    baselines = raw.get("baselines") or {}
    required = tuple(str(value).upper() for value in baselines.get("required", []) or [])
    required_any = tuple(str(value).upper() for value in baselines.get("required_any", []) or [])
    return required, required_any


def _issue_value(issue: object, *names: str) -> object | None:
    if isinstance(issue, dict):
        for name in names:
            value = issue.get(name)
            if value is not None:
                return value
        return None
    for name in names:
        value = getattr(issue, name, None)
        if value is not None:
            return value
    return None


def _entry_paths_exist(entry: object, manifest_dir: Path) -> bool:
    if not isinstance(entry, dict):
        return False
    groups = (
        ("source", "markdown", "md"),
        ("docx", "word"),
        ("volume", "volume_report", "volume_json"),
    )
    for aliases in groups:
        raw = next((entry.get(name) for name in aliases if entry.get(name)), None)
        if raw is None:
            return False
        path = Path(str(raw))
        if not path.is_absolute():
            path = manifest_dir / path
        if not path.is_file():
            return False
    return True


def audited_document_codes(
    manifest: dict[str, Any], report: object, manifest_path: str | Path
) -> set[str]:
    required = required_document_codes(manifest)
    documents = manifest.get("documents") if isinstance(manifest, dict) else None
    configured = manifest_document_codes(manifest)
    failed: set[str] = set()
    global_error = False
    for issue in getattr(report, "issues", ()):
        severity = str(_issue_value(issue, "severity") or "").upper()
        if severity != "ERROR":
            continue
        code = _issue_value(issue, "document_type", "document", "type")
        if code:
            failed.add(str(code).upper())
        else:
            # A global release error means the suite did not complete a
            # successful audit. Fail closed instead of treating every manifest
            # key as an audited baseline.
            global_error = True
    if global_error or not isinstance(documents, dict):
        return set()
    manifest_dir = Path(manifest_path).resolve().parent
    successful: set[str] = set()
    for code in required & configured:
        key = next((key for key in documents if str(key).upper() == code), None)
        if key is None or code in failed:
            continue
        if _entry_paths_exist(documents[key], manifest_dir):
            successful.add(code)
    return successful


def baseline_issues(
    manifest: dict[str, Any], audited_codes: Iterable[str]
) -> list[tuple[str, str, str]]:
    required_docs = required_document_codes(manifest)
    configured = manifest_document_codes(manifest)
    audited = {str(value).upper() for value in audited_codes}
    issues: list[tuple[str, str, str]] = []
    for code in sorted(required_docs):
        required, required_any = profile_baselines(code)
        for baseline in required:
            if baseline not in audited:
                reason = "未列入 required_documents" if baseline not in required_docs else "未成功审计"
                if baseline in configured and baseline not in required_docs:
                    reason += "；孤立的 documents 条目不得充当基线"
                issues.append((code, "SUITE_REQUIRED_BASELINE_NOT_AUDITED", f"{code} 必选基线 {baseline} {reason}"))
        if required_any and not (set(required_any) & audited):
            choices = ", ".join(required_any)
            issues.append((code, "SUITE_REQUIRED_ANY_BASELINE_NOT_AUDITED", f"{code} 至少需要一个成功审计的基线：{choices}"))
    return issues
''', encoding='utf-8')

