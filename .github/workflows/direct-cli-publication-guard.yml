name: direct-cli-publication-guard

on:
  push:
    branches: [fix/codex-review-findings-20260905]
    paths: [.github/workflows/direct-cli-publication-guard.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-review-findings-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make guarded CLI the direct public module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          pkg = root / 'skills/gjb438c-md-first/gjb438c_suite'
          cli = pkg / 'cli.py'
          legacy = pkg / '_legacy_cli.py'
          safe = pkg / 'safe_cli.py'
          if not safe.is_file():
              raise SystemExit('safe_cli.py is missing; direct-fix workflow did not complete')
          if not legacy.exists():
              shutil.copy2(cli, legacy)
          safe_text = safe.read_text(encoding='utf-8')
          safe_text = safe_text.replace('from . import cli as _legacy_cli', 'from . import _legacy_cli')
          safe.write_text(safe_text, encoding='utf-8')
          cli.write_text('''from __future__ import annotations\n\nfrom .safe_cli import main\n\n__all__ = ["main"]\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''', encoding='utf-8')

          pyproject = root / 'skills/gjb438c-md-first/pyproject.toml'
          text = pyproject.read_text(encoding='utf-8')
          text = re.sub(
              r'(?m)^gjb438c\s*=\s*"gjb438c_suite\.(?:safe_cli|cli):main"\s*$',
              'gjb438c = "gjb438c_suite.cli:main"',
              text,
          )
          pyproject.write_text(text, encoding='utf-8')

          test = root / 'skills/gjb438c-md-first/tests/test_public_cli_guard.py'
          test.write_text('''from gjb438c_suite import cli\n\n\ndef test_public_cli_release_requires_both_reports(monkeypatch, tmp_path):\n    called = False\n    def forbidden(_args):\n        nonlocal called\n        called = True\n        return 0\n    monkeypatch.setattr("gjb438c_suite.safe_cli._legacy_cli.main", forbidden)\n    result = cli.main([\n        "render", "source.md", "--profile", "release",\n        "--output", str(tmp_path / "release.docx"),\n    ])\n    assert result == 2\n    assert called is False\n\n\ndef test_public_cli_is_the_guarded_entrypoint():\n    assert cli.main.__module__ == "gjb438c_suite.safe_cli"\n''', encoding='utf-8')
          PY
      - name: Remove this one-shot workflow
        run: rm -f .github/workflows/direct-cli-publication-guard.yml
      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e 'skills/gjb438c-md-first[test]'
          python -m pytest skills/gjb438c-md-first/tests
          python -m compileall -q skills/gjb438c-md-first/gjb438c_suite
          gjb438c --help | tee /tmp/help.txt
          grep -q 'audit-volume' /tmp/help.txt
          grep -Eq 'audit-suite|suite-audit' /tmp/help.txt
      - name: Commit direct CLI guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'fix: make staged publication the public CLI path'
          git push origin HEAD:fix/codex-review-findings-20260905
