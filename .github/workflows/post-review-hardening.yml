name: post-review-hardening

on:
  push:
    branches: [fix/wire-20-profiles-volume-suite-20260905]
    paths:
      - tools/post_review_hardening.py
      - tools/post_review_hardening_followup.py
      - .github/workflows/post-review-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: /usr/lib/python3/dist-packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wire-20-profiles-volume-suite-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install patch prerequisites
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply post-review hardening
        run: |
          set -euo pipefail
          python tools/post_review_hardening.py
          python tools/post_review_hardening_followup.py
      - name: Install Office and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno poppler-utils
          python -m pip install --disable-pip-version-check -e 'skills/gjb438c-md-first[test]'
      - name: Compile and run all tests
        run: |
          set -euo pipefail
          python -m compileall -q skills/gjb438c-md-first/gjb438c_suite
          python -m pytest skills/gjb438c-md-first/tests
      - name: Verify self-contained wheel outside repository
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build
          python -m build --wheel skills/gjb438c-md-first --outdir /tmp/gjb438c-wheel
          python -m venv /tmp/gjb438c-wheel-venv
          /tmp/gjb438c-wheel-venv/bin/pip install /tmp/gjb438c-wheel/*.whl
          cd /tmp
          /tmp/gjb438c-wheel-venv/bin/gjb438c profile --type SSS --json >/tmp/wheel-SSS.json
          /tmp/gjb438c-wheel-venv/bin/gjb438c init --type STD --output /tmp/wheel-STD.md
          test -s /tmp/wheel-STD.md
      - name: Verify all 20 profiles and default skill routing
        run: |
          set -euo pipefail
          test "$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md -path 'skills/gjb438c-*/*' | wc -l)" -eq 21
          test ! -e skills/word-fillter-438c-srs
          test ! -e skills/word-fillter-438c-sdd
          test -f legacy-skills/word-fillter-438c-srs/SKILL.md
          test -f legacy-skills/word-fillter-438c-sdd/SKILL.md
          mkdir -p /tmp/gjb438c-all
          for type in SDP SIP STrP STP OCD SSS IRS SSDD IDD SRS SDD DBDD STD STR SPS SVD SUM CPM FSM SDSR; do
            gjb438c init --type "$type" \
              --project skills/gjb438c-md-first/examples/project.yaml \
              --output "/tmp/gjb438c-all/$type.md"
          done
          test "$(find /tmp/gjb438c-all -name '*.md' | wc -l)" -eq 20
          gjb438c profile --type STD --json >/tmp/STD.profile.json
          gjb438c volume-policy --type SDD --scale large --json >/tmp/SDD.volume.json
      - name: Verify 20-document suite workspace
        run: |
          set -euo pipefail
          gjb438c suite-init \
            --project skills/gjb438c-md-first/examples/project.yaml \
            --output /tmp/gjb438c-suite \
            --scale large \
            --min-body-pages 300
          test -f /tmp/gjb438c-suite/suite.yaml
          test "$(find /tmp/gjb438c-suite/docs -name '*.md' | wc -l)" -eq 20
          ! find /tmp/gjb438c-suite -name '*#U*' -print -quit | grep .
      - name: Prove actual 300-page content passes and padding fails
        run: python tools/stress_volume_gate.py
      - name: Remove one-shot patch tooling
        run: |
          set -euo pipefail
          rm -f tools/post_review_hardening.py
          rm -f tools/post_review_hardening_followup.py
          rm -f .github/workflows/post-review-hardening.yml
          test ! -e tools/post_review_hardening.py
          test ! -e .github/workflows/post-review-hardening.yml
      - name: Commit verified clean implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden profile routing, Word evidence, and suite release gates"
          git push origin HEAD:fix/wire-20-profiles-volume-suite-20260905
