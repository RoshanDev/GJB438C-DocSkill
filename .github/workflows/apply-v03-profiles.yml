name: apply-v03-profiles

on:
  push:
    branches:
      - feat/20-document-profiles-v03
    paths:
      - tools/apply_v03_profiles.py
      - .github/workflows/apply-v03-profiles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/20-document-profiles-v03
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration
        run: python tools/apply_v03_profiles.py
      - name: Install runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -e 'skills/gjb438c-md-first[test]'
      - name: Unit and integration tests
        run: python -m pytest skills/gjb438c-md-first/tests
      - name: Check all 20 source templates
        run: python skills/gjb438c-md-first/tools/smoke_all_templates.py
      - name: Check all 20 bundled profiles without template root
        run: |
          for type in SDP SIP STrP STP OCD SSS IRS SSDD IDD SRS SDD DBDD STD STR SPS SVD SUM CPM FSM SDSR; do
            gjb438c init --type "$type" --project skills/gjb438c-md-first/examples/project.yaml --output "/tmp/$type.md"
          done
          gjb438c volume-policy --type SDD --scale large
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate 20 self-contained profiles and volume gates"
          git push origin HEAD:feat/20-document-profiles-v03
