name: repair-gjb438c-main-runtime

on:
  push:
    branches: [fix/wire-20-profiles-volume-suite-20260905]
    paths:
      - tools/repair_runtime_core_a.py
      - tools/repair_runtime_core_b.py
      - tools/repair_runtime_tests.py
      - .github/workflows/repair-main-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: /usr/lib/python3/dist-packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wire-20-profiles-volume-suite-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install patch prerequisites
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply runtime repair
        run: |
          set -euo pipefail
          python tools/repair_runtime_core_a.py
          python tools/repair_runtime_core_b.py
          python tools/repair_runtime_tests.py
      - name: Install Office and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno poppler-utils
          python -m pip install --disable-pip-version-check -e 'skills/gjb438c-md-first[test]'
      - name: Compile and run all tests
        run: |
          set -euo pipefail
          python -m compileall -q skills/gjb438c-md-first/gjb438c_suite
          python -m pytest skills/gjb438c-md-first/tests
      - name: Prove all 20 profiles work without repository templates
        run: |
          set -euo pipefail
          mkdir -p /tmp/gjb438c-all
          for type in SDP SIP STrP STP OCD SSS IRS SSDD IDD SRS SDD DBDD STD STR SPS SVD SUM CPM FSM SDSR; do
            gjb438c init --type "$type" \
              --project skills/gjb438c-md-first/examples/project.yaml \
              --output "/tmp/gjb438c-all/$type.md"
          done
          test "$(find /tmp/gjb438c-all -name '*.md' | wc -l)" -eq 20
          gjb438c profile --type SSS --json >/tmp/SSS.profile.json
          gjb438c volume-policy --type STD --scale large --json >/tmp/STD.volume.json
      - name: Prove 20-document suite initialization
        run: |
          set -euo pipefail
          gjb438c suite-init \
            --project skills/gjb438c-md-first/examples/project.yaml \
            --output /tmp/gjb438c-suite \
            --scale large \
            --min-body-pages 300
          test -f /tmp/gjb438c-suite/suite.yaml
          test "$(find /tmp/gjb438c-suite/docs -name '*.md' | wc -l)" -eq 20
          ! find /tmp/gjb438c-suite -name '*#U*' -print -quit | grep .
      - name: Run actual 300-page anti-padding stress test
        run: python tools/stress_volume_gate.py
      - name: Remove repair and leaked integration scaffolding
        run: |
          set -euo pipefail
          rm -f tools/repair_runtime_core_a.py tools/repair_runtime_core_b.py tools/repair_runtime_tests.py
          rm -f .github/workflows/repair-main-runtime.yml
          rm -rf .bootstrap-v03
          rm -f .github/workflows/analyze-template-pages.yml
          rm -f .github/workflows/apply-v03-profiles.yml
          rm -f .github/workflows/export-gjb438c-feature-source.yml
          rm -f .github/workflows/export-review-source.yml
          rm -f .github/workflows/finalize-v03.yml
          rm -f tools/apply_v03_profiles.py
          test ! -e .bootstrap-v03
          test ! -e .github/workflows/apply-v03-profiles.yml
      - name: Commit verified clean implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: wire 20 profiles, rendered volume gates, and suite audit"
          git push origin HEAD:fix/wire-20-profiles-volume-suite-20260905
