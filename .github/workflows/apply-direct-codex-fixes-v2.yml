name: apply-direct-codex-fixes-v2

on:
  push:
    branches: [fix/codex-review-findings-20260905]
    paths: [.github/workflows/apply-direct-codex-fixes-v2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-review-findings-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bootstrap dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Ensure direct runtime is materialized
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f skills/gjb438c-md-first/gjb438c_suite/volume.py; then
            python - <<'PY'
          from pathlib import Path
          import re, runpy
          root = Path.cwd()
          core_b = root / 'tools/repair_runtime_core_b.py'
          if core_b.exists():
              text = core_b.read_text(encoding='utf-8').replace(
                  '        floor = minimum_body_pages(profile.document_type.code, tier, min_body_pages)',
                  '    floor = minimum_body_pages(profile.document_type.code, tier, min_body_pages)',
              )
              core_b.write_text(text, encoding='utf-8')
          original = re.sub
          def safe_sub(pattern, repl, string, count=0, flags=0):
              try:
                  return original(pattern, repl, string, count=count, flags=flags)
              except re.error as exc:
                  if isinstance(repl, str) and 'bad escape' in str(exc):
                      return re.compile(pattern, flags).sub(lambda _m: repl, string, count=count)
                  raise
          for rel, safe in (
              ('tools/repair_runtime_core_a.py', False),
              ('tools/repair_runtime_core_b.py', False),
              ('tools/post_review_hardening.py', True),
              ('tools/post_review_hardening_followup.py', True),
          ):
              path = root / rel
              if not path.exists():
                  raise SystemExit(f'missing generator {rel}')
              try:
                  re.sub = safe_sub if safe else original
                  runpy.run_path(str(path), run_name='__main__')
              finally:
                  re.sub = original
          PY
          fi
          test -f skills/gjb438c-md-first/gjb438c_suite/volume.py
          test -f skills/gjb438c-md-first/gjb438c_suite/suite.py
          test -f skills/gjb438c-md-first/gjb438c_suite/profile_quality.py
      - name: Write direct publication and audited-baseline guards
        shell: bash
