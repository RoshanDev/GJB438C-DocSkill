name: inspect-unreferenced-payload
on:
  push:
    branches: [probe/payload-inspect-20260905]
    paths:
      - '.payload/**'
      - '.github/workflows/inspect-unreferenced-payload.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect payload
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part-* | base64 --decode > /tmp/payload.tar.xz
          xz --test /tmp/payload.tar.xz
          mkdir -p /tmp/extracted
          tar -xJf /tmp/payload.tar.xz -C /tmp/extracted
          sha256sum /tmp/payload.tar.xz | tee /tmp/PAYLOAD-SHA256
          (cd /tmp/extracted && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/MANIFEST.sha256
          (cd /tmp/extracted && find . -type f -printf '%P\n' | sort) > /tmp/FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: inspected-payload
          path: |
            /tmp/payload.tar.xz
            /tmp/PAYLOAD-SHA256
            /tmp/MANIFEST.sha256
            /tmp/FILES.txt
          retention-days: 1
