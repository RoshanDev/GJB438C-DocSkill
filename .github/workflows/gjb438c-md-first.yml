name: gjb438c-md-first
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "skills/gjb438c-md-first[test]" wheel
      - run: python -m compileall -q skills/gjb438c-md-first/gjb438c_suite
      - run: python -m pytest skills/gjb438c-md-first/tests -q --junitxml=test-results.xml
      - run: python tools/check_wheel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          retention-days: 7
  review-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked revision for independent reproduction
        run: |
          mkdir -p /tmp/gjb-reviewed-source
          git archive --format=tar.gz HEAD -o /tmp/gjb-reviewed-source/source.tar.gz
          git rev-parse HEAD > /tmp/gjb-reviewed-source/COMMIT
          sha256sum /tmp/gjb-reviewed-source/source.tar.gz > /tmp/gjb-reviewed-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: /tmp/gjb-reviewed-source/
          retention-days: 7
  office:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Office integration dependencies (no source mutations)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno fonts-noto-cjk poppler-utils
      - run: python -m pip install -e 'skills/gjb438c-md-first[test]'
      - run: python -m pytest skills/gjb438c-md-first/tests/test_office_integration.py -q
        env:
          GJB_OFFICE_TESTS: '1'
          PYTHONPATH: /usr/lib/python3/dist-packages
      - name: Synthetic 300-page pagination and duplicate detector (not content acceptance)
        run: python tools/stress_volume_gate.py
