name: apply-codex-review-findings

on:
  push:
    branches: [fix/codex-review-findings-20260905]
    paths:
      - .github/workflows/apply-codex-review-findings.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-review-findings-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator prerequisites
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Materialize the runtime into the reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import os
          import re
          import runpy
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root))

          # Codex finding: core B expected an eight-space line although core A emits
          # it at function scope.  Patch the transient generator before using it.
          core_b = root / 'tools/repair_runtime_core_b.py'
          if core_b.exists():
              text = core_b.read_text(encoding='utf-8')
              text = text.replace(
                  '        floor = minimum_body_pages(profile.document_type.code, tier, min_body_pages)',
                  '    floor = minimum_body_pages(profile.document_type.code, tier, min_body_pages)',
              )
              core_b.write_text(text, encoding='utf-8')

          # Codex finding: a literal replacement containing \\s was interpreted as
          # a replacement-template escape.  During one-shot materialisation, retry
          # such substitutions with a callable replacement so the text is literal.
          original_sub = re.sub
          def safe_sub(pattern, repl, string, count=0, flags=0):
              try:
                  return original_sub(pattern, repl, string, count=count, flags=flags)
              except re.error as exc:
                  if isinstance(repl, str) and 'bad escape' in str(exc):
                      return re.compile(pattern, flags).sub(lambda _m: repl, string, count=count)
                  raise

          sequence = [
              ('tools/repair_runtime_core_a.py', False),
              ('tools/repair_runtime_core_b.py', False),
              ('tools/post_review_hardening.py', True),
              ('tools/post_review_hardening_followup.py', True),
          ]
          for relative, needs_safe_sub in sequence:
              path = root / relative
              if not path.exists():
                  raise SystemExit(f'missing materialisation script: {relative}')
              try:
                  re.sub = safe_sub if needs_safe_sub else original_sub
                  runpy.run_path(str(path), run_name='__main__')
              finally:
                  re.sub = original_sub

          required = [
              root / 'skills/gjb438c-md-first/gjb438c_suite/volume.py',
              root / 'skills/gjb438c-md-first/gjb438c_suite/suite.py',
              root / 'skills/gjb438c-md-first/gjb438c_suite/profile_quality.py',
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'direct runtime was not materialised: {missing}')
          PY
      - name: Remove one-shot generators and branch-mutating workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-codex-review-findings.yml
          rm -f .github/workflows/export-codex-review-worktree.yml
          rm -f .github/workflows/post-review-hardening.yml
          rm -f .github/workflows/repair-runtime.yml
          rm -f .github/workflows/repair-runtime-core.yml
          rm -f .github/workflows/repair-runtime-core-a.yml
          rm -f .github/workflows/repair-runtime-core-b.yml
          rm -f tools/repair_runtime_core_a.py
          rm -f tools/repair_runtime_core_b.py
          rm -f tools/post_review_hardening.py
          rm -f tools/post_review_hardening_followup.py
          rm -f tools/apply_runtime_repair.py
          rm -f tools/apply_runtime_repair_part2.py
      - name: Verify direct runtime and install package
        shell: bash
        run: |
          set -euo pipefail
          test -f skills/gjb438c-md-first/gjb438c_suite/volume.py
          test -f skills/gjb438c-md-first/gjb438c_suite/suite.py
          test -f skills/gjb438c-md-first/gjb438c_suite/profile_quality.py
          test -d legacy-skills/word-fillter-438c-srs
          test -d legacy-skills/word-fillter-438c-sdd
          test ! -d skills/word-fillter-438c-srs
          test ! -d skills/word-fillter-438c-sdd
          python -m pip install --disable-pip-version-check -e 'skills/gjb438c-md-first[test]'
      - name: Run full tests and CLI smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest skills/gjb438c-md-first/tests
          python -m compileall -q skills/gjb438c-md-first/gjb438c_suite
          gjb438c --help | tee /tmp/help.txt
          grep -q 'audit-volume' /tmp/help.txt
          grep -q 'volume-policy' /tmp/help.txt
          grep -Eq 'audit-suite|suite-audit' /tmp/help.txt
          for type in SDP SIP STrP STP OCD SSS IRS SSDD IDD SRS SDD DBDD STD STR SPS SVD SUM CPM FSM SDSR; do
            gjb438c init --type "$type" --project skills/gjb438c-md-first/examples/project.yaml --output "/tmp/$type.md"
          done
      - name: Commit only the directly reviewable implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'fix: materialize runtime and address Codex review findings'
          git push origin HEAD:fix/codex-review-findings-20260905
