name: gate-pr4-stable-head-v3

on:
  push:
    branches: [automation/codex-gate-pr4]
    paths: [.github/workflows/gate-pr4-stable-head-v3.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  review-test-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: RoshanDev/GJB438C-DocSkill
      PR: '4'
    steps:
      - name: Wait for the corrective branch to become stable
        shell: bash
        run: |
          set -euo pipefail
          stable=0
          previous=''
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
            merged=$(gh api "repos/$REPO/pulls/$PR" --jq .merged)
            [[ "$state" == open && "$merged" == false ]] || {
              echo "PR is not an open unmerged corrective PR" >&2; exit 1;
            }
            current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            active=$(gh api "repos/$REPO/actions/runs?head_sha=$current&per_page=100" --jq \
              '[.workflow_runs[] | select(.status != "completed")] | length')
            failed=$(gh api "repos/$REPO/actions/runs?head_sha=$current&per_page=100" --jq \
              '[.workflow_runs[] | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
            if [[ "$current" == "$previous" && "$active" -eq 0 && "$failed" -eq 0 ]]; then
              stable=$((stable + 1))
            else
              stable=0
            fi
            previous="$current"
            if [[ "$stable" -ge 3 ]]; then
              echo "HEAD_SHA=$current" >> "$GITHUB_ENV"
              break
            fi
            sleep 20
          done
          [[ "${stable:-0}" -ge 3 ]] || { echo 'Branch did not become stable' >&2; exit 1; }
      - name: Mark ready and request a fresh exact-head Codex review
        shell: bash
        run: |
          set -euo pipefail
          gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
            -f id="$(gh api repos/$REPO/pulls/$PR --jq .node_id)" >/dev/null || true
          marker="CODEX_GATE_V3_HEAD_$HEAD_SHA"
          trigger=$(gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review

$marker

请基于当前精确 head \`$HEAD_SHA\` 做完整复审。发现任何问题都请提交 inline finding；本门禁在当前 head 无 findings、CI 全绿、未解决线程为零之前不会合并。" --jq .id)
          echo "TRIGGER_ID=$trigger" >> "$GITHUB_ENV"
      - name: Wait for a clean review and reject every current-head finding
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            [[ "$current" == "$HEAD_SHA" ]] || {
              echo "Head moved from $HEAD_SHA to $current; review is stale" >&2; exit 1;
            }
            findings=$(gh api "repos/$REPO/pulls/$PR/comments?per_page=100" --paginate --jq \
              '[.[] | select(.user.login == "chatgpt-codex-connector[bot]" or .user.login == "chatgpt-codex-connector") | select((.commit_id // .original_commit_id // "") == env.HEAD_SHA)] | length')
            if [[ "$findings" -gt 0 ]]; then
              gh api "repos/$REPO/issues/$PR/comments" -f body="Codex gate blocked merge for exact head \`$HEAD_SHA\`: $findings inline finding(s) were reported. Push fixes and start a new review cycle." >/dev/null
              exit 1
            fi
            clean=$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/issues/comments/$TRIGGER_ID/reactions?per_page=100" --jq \
              '[.[] | select((.user.login == "chatgpt-codex-connector[bot]" or .user.login == "chatgpt-codex-connector") and .content == "+1")] | length')
            if [[ "$clean" -gt 0 ]]; then
              echo 'Codex marked this exact-head request clean'
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for Codex review' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: RoshanDev/GJB438C-DocSkill
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify direct source and absence of transient integration machinery
        shell: bash
        run: |
          set -euo pipefail
          test -f skills/gjb438c-md-first/gjb438c_suite/volume.py
          test -f skills/gjb438c-md-first/gjb438c_suite/suite.py
          test -f skills/gjb438c-md-first/gjb438c_suite/profile_quality.py
          test -f skills/gjb438c-md-first/gjb438c_suite/publication.py
          test -f skills/gjb438c-md-first/gjb438c_suite/safe_cli.py
          test -f skills/gjb438c-md-first/gjb438c_suite/_legacy_cli.py
          test -d legacy-skills/word-fillter-438c-srs
          test -d legacy-skills/word-fillter-438c-sdd
          test ! -d skills/word-fillter-438c-srs
          test ! -d skills/word-fillter-438c-sdd
          test ! -d .bootstrap-v03
          test ! -f .github/workflows/post-review-hardening.yml
          test ! -f .github/workflows/apply-v03-profiles.yml
          test ! -f .github/workflows/finalize-v03.yml
          test ! -f tools/repair_runtime_core_a.py
          test ! -f tools/repair_runtime_core_b.py
          test ! -f tools/post_review_hardening.py
          test ! -f tools/post_review_hardening_followup.py
      - name: Run full current-head regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e 'skills/gjb438c-md-first[test]'
          python -m pytest skills/gjb438c-md-first/tests
          python -m compileall -q skills/gjb438c-md-first/gjb438c_suite
          gjb438c --help | tee /tmp/help.txt
          grep -q audit-volume /tmp/help.txt
          grep -q volume-policy /tmp/help.txt
          grep -Eq 'audit-suite|suite-audit' /tmp/help.txt
      - name: Require zero unresolved current-head Codex threads
        shell: bash
        run: |
          set -euo pipefail
          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated comments(first:20){nodes{author{login}commit{oid}}}}}}}}'
          unresolved=$(gh api graphql -f query="$query" -F owner=RoshanDev -F name=GJB438C-DocSkill -F number=4 --jq \
            '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false) | select(any(.comments.nodes[]; ((.author.login == "chatgpt-codex-connector" or .author.login == "chatgpt-codex-connector[bot]") and .commit.oid == env.HEAD_SHA)))] | length')
          [[ "$unresolved" -eq 0 ]] || { echo "$unresolved unresolved Codex threads" >&2; exit 1; }
      - name: Merge only the exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" == "$HEAD_SHA" ]]
          gh api -X PUT "repos/$REPO/pulls/$PR/merge" \
            -f sha="$HEAD_SHA" \
            -f merge_method=squash \
            -f commit_title='fix: close Codex post-merge review findings' \
            -f commit_message='Direct source materialisation, audited-baseline enforcement, atomic DOCX/report publication, regression coverage, passing CI, and a clean Codex review on the exact merged head.' \
            --jq '{merged,message,sha}'
